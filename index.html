<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WealthNest</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>WealthNest</h1>

    <main>
        <header>
            <div>
                <h5>Total Balance:</h5>
                <span id="balance">0 Kč</span>
            </div>
            <div>
                <h5>Income:</h5>
                <span id="income">0 Kč</span>
            </div>
            <div>
                <h5>Expense:</h5>
                <span id="expence">0 Kč</span>
            </div>
        </header>

        <section>
            <h3>Transactions</h3>
            <ul id="transactionsList"></ul>
            <div id="status">
            </div>
        </section>

        <section>
            <h3> Add transaction</h3>
            <form action="" id="transaction-form">
                <div>
                    <label for="type">
                        <input type="checkbox" id="type" name="type" />
                        <div class="option">
                            <span>Expense</span>
                            <span>Income</span>
                        </div>
                    </label>
                </div>
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter text..." required>
                </div>
                <div>
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount" placeholder="Enter amount..." min="0.01" step="0.01"
                        required>
                </div>
                <div>
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <button class="button" type="submit">Submit</button>
            </form>
        </section>
    </main>

    <!--Javascript File-->
    <script src="home.js"></script>

</body>

</html>
