<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WealthNest</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>WealthNest</h1>

    <main>
        <header>
            <div>
                <h5>Total Balance:</h5>
                <span id="balance">0 Kč</span>
            </div>
            <div>
                <h5>Income:</h5>
                <span id="income">0 Kč</span>
            </div>
            <div>
                <h5>Expense:</h5>
                <span id="expence">0 Kč</span>
            </div>
        </header>

        <section>
            <h3>Transactions</h3>
            <label for="category-filter">Filter by category:</label>
            <select id="category-filter">
                <option value="all">All</option>
            </select>

            <ul id="transactionsList"></ul>
            <div id="status">
            </div>
        </section>

        <section>
            <h3> Add transaction</h3>
            <form id="transaction-form">
                <div class="toogle-wrapper">
                    <input type="checkbox" id="type" name="type"
                        aria-label="Transaction type: check for income, uncheck for expense">
                    <label for="type" class="option">
                        <!-- <div class="option"> -->
                        <span>💸Expense</span>
                        <span>💰Income</span>
                        <!-- </div> -->
                    </label>
                </div>


                <div>
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="" disabled selected>Select a category</option>
                        <option value="🛒 Grocery">🛒 Grocery</option>
                        <option value="💄 Beauty">💄 Beauty</option>
                        <option value="💊 Drugstore">💊 Drugstore</option>
                        <option value="💚 Health">💚 Health</option>
                        <option value="💼 Salary">💼 Salary</option>
                        <option value="🎁 Gift">🎁 Gift</option>
                        <option value="🎓 Education">🎓 Education</option>
                        <option value="🏠 Rent">🏠 Rent</option>
                        <option value="__custom__">➕ Add category</option>
                    </select>
                </div>

                <!-- Hidden until "Add custom" is selected -->
                <div id="custom-category-fields" style="display: none;">
                    <label for="custom-emoji">Emoji</label>
                    <input type="text" id="custom-emoji" placeholder="e.g. 🧃" maxlength="10">

                    <label for="custom-name">Category Name</label>
                    <input type="text" id="custom-name" placeholder="e.g. Eating Out">
                </div>


                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter text..." required>
                </div>
                <div>
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount" placeholder="Enter amount..." min="0.01" step="0.01"
                        required>
                </div>
                <div>
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div id="form-error" class="error"></div>
                <button class="button" type="submit">Submit</button>
            </form>
        </section>

        <!-- DELETE MODAL -->
        <section id="delete-modal" class="modal hidden" role="dialog">
            <div class="modal-content">
                <h3>Delete Transaction</h3>
                <p>Are you sure you want to delete this transaction?</p>
                <div class="modal-actions">
                    <button id="confirm-delete-btn">Yes, delete</button>
                    <button id="cancel-delete-btn">Cancel</button>
                </div>
            </div>
        </section>

        <!-- EDIT MODAL -->
        <section id="edit-modal" class="modal hidden" role="dialog">
            <div class="modal-content">
                <h3>Edit Transaction</h3>

                <label for="edit-name">Name:</label>
                <input type="text" id="edit-name">

                <label for="edit-amount">Amount:</label>
                <input type="number" id="edit-amount" min="0.01" step="0.01">

                <label for="edit-date">Date:</label>
                <input type="date" id="edit-date">

                <label for="edit-type">Type:</label>
                <select id="edit-type">
                    <option value="income">Income</option>
                    <option value="expence">Expense</option>
                </select>

                <label for="edit-category">Category:</label>
                <select id="edit-category"></select>

                <div id="edit-error" class="error"></div>

                <div class="modal-actions">
                    <button id="save-edit-btn">Save</button>
                    <button id="cancel-edit-btn">Cancel</button>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2025 WealthNest. All rights reserved.</p>
    </footer>

    <!--Javascript File-->
    <script src="home.js"></script>

</body>

</html>
